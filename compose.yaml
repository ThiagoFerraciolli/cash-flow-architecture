services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: cashflow
      POSTGRES_USER: cashflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cashflow_local_only}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ./runtime-data/postgres:/var/lib/postgresql/data
      - ./src/Transactions/CashFlow.Transactions.Infrastructure/Migrations/001_financial_transactions.sql:/docker-entrypoint-initdb.d/001_financial_transactions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashflow -d cashflow && psql -U cashflow -d cashflow -tAc \"SELECT to_regclass('public.financial_transactions') IS NOT NULL\" | grep -q t"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  transactions-api:
    build:
      context: .
      dockerfile: src/Transactions/CashFlow.Transactions.Api/Dockerfile
    environment:
      ConnectionStrings__Transactions: Host=postgres;Port=5432;Database=cashflow;Username=cashflow;Password=${POSTGRES_PASSWORD:-cashflow_local_only}
      Transactions__TimeZone: America/Sao_Paulo
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
