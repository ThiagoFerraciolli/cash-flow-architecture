services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: cashflow
      POSTGRES_USER: cashflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cashflow_local_only}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ./runtime-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashflow -d cashflow"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  postgres-consolidation:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: consolidation
      POSTGRES_USER: consolidation
      POSTGRES_PASSWORD: ${CONSOLIDATION_POSTGRES_PASSWORD:-consolidation_local_only}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - ./runtime-data/consolidation-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U consolidation -d consolidation"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  migrate-consolidation:
    image: postgres:17.6-bookworm
    environment:
      PGPASSWORD: ${CONSOLIDATION_POSTGRES_PASSWORD:-consolidation_local_only}
    volumes:
      - ./src/Consolidation/CashFlow.Consolidation.Infrastructure/Migrations:/migrations:ro
    entrypoint: ["psql", "-v", "ON_ERROR_STOP=1", "-h", "postgres-consolidation", "-U", "consolidation", "-d", "consolidation", "-f", "/migrations/apply-local.sql"]
    depends_on:
      postgres-consolidation:
        condition: service_healthy
    restart: "no"

  migrate:
    image: postgres:17.6-bookworm
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-cashflow_local_only}
    volumes:
      - ./src/Transactions/CashFlow.Transactions.Infrastructure/Migrations:/migrations:ro
    entrypoint: ["psql", "-v", "ON_ERROR_STOP=1", "-h", "postgres", "-U", "cashflow", "-d", "cashflow", "-f", "/migrations/apply-local.sql"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  rabbitmq:
    image: rabbitmq:4.1.8-management
    hostname: rabbitmq
    environment:
      RABBITMQ_NODENAME: rabbit@rabbitmq
      RABBITMQ_DEFAULT_USER: cashflow
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-cashflow_local_only}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - ./runtime-data/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "127.0.0.1:16686:16686"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:13133/status"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  identity:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in a local .env file}
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      DEMO_CLIENT_SECRET: ${DEMO_CLIENT_SECRET:?Set DEMO_CLIENT_SECRET in a local .env file}
      READER_CLIENT_SECRET: ${READER_CLIENT_SECRET:?Set READER_CLIENT_SECRET in a local .env file}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./runtime-data/identity:/opt/keycloak/data
      - ./identity/cashflow-realm.json:/opt/keycloak/data/import/cashflow-realm.json:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "{ printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 90s
    restart: unless-stopped

  transactions-api:
    build:
      context: .
      dockerfile: src/Transactions/CashFlow.Transactions.Api/Dockerfile
    environment:
      ConnectionStrings__Transactions: Host=postgres;Port=5432;Database=cashflow;Username=cashflow;Password=${POSTGRES_PASSWORD:-cashflow_local_only}
      Transactions__TimeZone: America/Sao_Paulo
      Authentication__Authority: ${CASHFLOW_AUTHORITY:-http://identity:8080/realms/cashflow}
      Authentication__Issuer: ${CASHFLOW_ISSUER:-http://localhost:8080/realms/cashflow}
      Authentication__Audience: cashflow-api
      Authentication__AllowedClientIds: ${CASHFLOW_ALLOWED_CLIENT_IDS:-cashflow-demo,cashflow-reader}
      Authentication__RequireHttpsMetadata: "false"
      Observability__OtlpEndpoint: http://jaeger:4318/v1/traces
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  transactions-worker:
    build:
      context: .
      dockerfile: src/Transactions/CashFlow.Transactions.Worker/Dockerfile
    environment:
      ConnectionStrings__Transactions: Host=postgres;Port=5432;Database=cashflow;Username=cashflow;Password=${POSTGRES_PASSWORD:-cashflow_local_only}
      RabbitMq__Uri: amqp://cashflow:${RABBITMQ_PASSWORD:-cashflow_local_only}@rabbitmq:5672/
      Observability__OtlpEndpoint: http://jaeger:4318/v1/traces
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  consolidation-worker:
    build:
      context: .
      dockerfile: src/Consolidation/CashFlow.Consolidation.Worker/Dockerfile
    environment:
      ConnectionStrings__Consolidation: Host=postgres-consolidation;Port=5432;Database=consolidation;Username=consolidation;Password=${CONSOLIDATION_POSTGRES_PASSWORD:-consolidation_local_only}
      RabbitMq__Uri: amqp://cashflow:${RABBITMQ_PASSWORD:-cashflow_local_only}@rabbitmq:5672/
      Observability__OtlpEndpoint: http://jaeger:4318/v1/traces
    depends_on:
      migrate-consolidation:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  consolidation-api:
    build:
      context: .
      dockerfile: src/Consolidation/CashFlow.Consolidation.Api/Dockerfile
    environment:
      ConnectionStrings__Consolidation: Host=postgres-consolidation;Port=5432;Database=consolidation;Username=consolidation;Password=${CONSOLIDATION_POSTGRES_PASSWORD:-consolidation_local_only}
      Authentication__Authority: ${CASHFLOW_AUTHORITY:-http://identity:8080/realms/cashflow}
      Authentication__Issuer: ${CASHFLOW_ISSUER:-http://localhost:8080/realms/cashflow}
      Authentication__Audience: cashflow-api
      Authentication__AllowedClientIds: ${CASHFLOW_ALLOWED_CLIENT_IDS:-cashflow-demo,cashflow-reader}
      Authentication__RequireHttpsMetadata: "false"
      Observability__OtlpEndpoint: http://jaeger:4318/v1/traces
    ports:
      - "127.0.0.1:8082:8080"
    depends_on:
      migrate-consolidation:
        condition: service_completed_successfully
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
